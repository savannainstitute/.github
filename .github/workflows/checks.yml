  cancel-in-progress: true

jobs:
  checks:
    uses: savannainstitute/standards/.github/workflows/checks.yml@4999fcd0455c4e7fce317d541d23f22aa0a14720
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
