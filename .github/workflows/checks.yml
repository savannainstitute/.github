name: checks

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    uses: savannainstitute/standards/.github/workflows/checks.yml@ec7bf81e1095bfa8e9190a145b1c649b9c622e5d
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
