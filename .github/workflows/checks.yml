name: checks

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    uses: savannainstitute/standards/.github/workflows/checks.yml@1fa826deb4061e6e622232da5b51c19987a344a6
    with:
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
